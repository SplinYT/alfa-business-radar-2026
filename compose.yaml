services:
  radar:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DB_PATH: /state/radar.sqlite
    volumes:
      - radar_state:/state
      - ./data/private:/private:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  radar_state:
